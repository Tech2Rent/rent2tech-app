<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Tech2Rent Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: radial-gradient(ellipse at top left, #c3e0fa 0%, #a7a7e9 60%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
      font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 8px 44px rgba(79, 84, 168, 0.13);
      padding: 44px 36px 38px 36px;
      max-width: 410px;
      width: 97%;
      margin: 38px auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-card img {
      width: 64px;
      margin-bottom: 12px;
      margin-top: 0;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .login-card h1 {
      font-size: 30px;
      color: #596afb;
      margin-bottom: 5px;
      font-weight: 700;
      margin-top: 10px;
      font-family: inherit;
    }

    .login-card p {
      color: #8f9bc7;
      margin-bottom: 24px;
      font-size: 16.5px;
      font-weight: 500;
    }

    .login-card input {
      border-radius: 11px;
      border: 1.5px solid #e3e8fb;
      background: #f7f8fa;
      outline: none;
      font-size: 15.5px;
      margin: 12px 0;
      padding: 13px;
      display: block;
      width: 100%;
      box-sizing: border-box;
    }

    .login-card button {
      width: 100%;
      padding: 13px 0;
      background: linear-gradient(98deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      margin-top: 18px;
      box-shadow: 0 4px 18px rgba(108, 106, 179, 0.09);
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    .login-card button:hover {
      transform: scale(1.03);
    }

    .login-card .err {
      color: #e3342f;
      font-size: 15px;
      margin-top: 14px;
      min-height: 23px;
    }

    .login-footer {
      margin-top: 28px;
      color: #b9bdd7;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji/assets/svg/1f680.svg" alt="Rocket">
    <h1>Tech2Rent</h1>
    <p>Gestionale Noleggio Operativo</p>
    
    <input type="email" id="email" placeholder="Email" autocomplete="username" required>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
    
    <button onclick="doLogin()">Accedi</button>
    
    <div id="msg" class="err"></div>
    
    <div class="login-footer">v1.0 Powered by Tech2Rent • Supabase • Vercel</div>
  </div>

  <!-- Supabase JS Library -->
  <script src="https://unpkg.com/@supabase/supabase-js"></script>

  <script>
    // ⚙️ CONFIGURAZIONE SUPABASE
    const SUPABASE_URL = 'https://bxebimhellilckhzzvqe.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4ZWJpbWhlbGxpbGNraHp6dnFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI0MTkxMTQsImV4cCI6MjA3Nzk5NTExNH0.KEpOaIheZaZOCqvf6xnI4KtBrxTayPvp6dIFebsnkt8';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ✅ CHECK SE UTENTE GIÀ LOGGATO
    supabase.auth.getSession().then(({ data }) => {
      if (data.session) {
        // Utente già loggato, determina destinazione
        const userEmail = data.session.user.email;
        
        if (userEmail === 'operations@tech2rent.it') {
          // Admin → vai su admin.html
          window.location.href = 'admin.html';
        } else {
          // Utente normale → vai su dashboard.html
          window.location.href = 'dashboard.html';
        }
      }
    });

    // 🔐 FUNZIONE LOGIN
    async function doLogin() {
      document.getElementById('msg').textContent = '';
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      
      // Validazione input
      if (!email || !password) {
        document.getElementById('msg').textContent = '⚠️ Inserisci email e password';
        return;
      }

      try {
        // Login
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          document.getElementById('msg').textContent = '❌ Credenziali errate';
          console.error('Login error:', error);
          return;
        }

        // ✅ LOGIN SUCCESSFUL - Determina destinazione
        if (email === 'operations@tech2rent.it') {
          // Admin → vai su admin.html
          console.log('Admin login detected, redirecting to admin.html');
          window.location.href = 'admin.html';
        } else {
          // Utente normale → vai su dashboard.html
          console.log('User login detected, redirecting to dashboard.html');
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        document.getElementById('msg').textContent = '❌ Errore di connessione';
        console.error('Login exception:', err);
      }
    }

    // ⌨️ ENTER per loggare
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        doLogin();
      }
    });
  </script>
</body>
</html>
